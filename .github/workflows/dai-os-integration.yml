name: D_AI OS integration checks
on:
  push:
    paths:
      - "script/dai_desktop.py"
      - "tests/test_dai_desktop_integration.py"
      - ".github/workflows/dai-os-integration.yml"
  pull_request:
    paths:
      - "script/dai_desktop.py"
      - "tests/test_dai_desktop_integration.py"
      - ".github/workflows/dai-os-integration.yml"
jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -p 'test_dai_desktop_integration.py' -v
